
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us | LMS Platform</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
        }

        .lms-navbar,
        footer {
            background-color: #4873f5;
            color: white;
        }

        .lms-navbar .navbar-brand,
        .lms-navbar .nav-link {
            color: white;
        }

        .lms-navbar .nav-link:hover,
        .lms-navbar .nav-link.active {
            color: #e0e7ff;
        }

        .contact-section {
            flex: 1;
            padding: 30px 0 45px;
            background-color: #f8f9fa;
        }

        .contact-section h1 {
            text-align: center;
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 28px;
            color: #343a40;
        }

        .form-label {
            font-size: 14px;
            margin-bottom: 7px;
            color: #343a40;
        }

        .form-control {
            font-size: 14px;
            border: 1px solid #dee2e6;
            border-radius: 5px;
        }

        textarea.form-control {
            min-height: 100px;
            resize: vertical;
        }

        .btn-blue {
            background-color: #4873f5;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 8px 14px;
            font-size: 14px;
        }

        .btn-blue:hover {
            background-color: #3156c9;
            color: white;
        }

        footer {
            margin-top: auto;
            text-align: center;
            padding: 18px 10px;
            font-size: 13px;
        }

        @media (max-width: 576px) {
            .contact-section {
                padding: 25px 0 35px;
            }

            .contact-section h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg lms-navbar">
        <div class="container">

            <a class="navbar-brand" href="index.html">LMS</a>

            <button class="navbar-toggler bg-light"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#mainMenu"
                    aria-controls="mainMenu"
                    aria-expanded="false"
                    aria-label="Toggle navigation">

                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mainMenu">
                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="courses.html">Courses</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="about.html">About</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active"
                           aria-current="page"
                           href="contact.html">Contact</a>
                    </li>

                </ul>
            </div>
        </div>
    </nav>

    <!-- Contact Form -->
    <main class="contact-section">
        <div class="container">

            <h1>Contact Us</h1>

            <form id="contactForm">

                <div class="mb-3">
                    <label for="name" class="form-label">Name</label>
                    <input type="text"
                           class="form-control"
                           id="name"
                           name="name"
                           placeholder="Your Name"
                           required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email"
                           class="form-control"
                           id="email"
                           name="email"
                           placeholder="Your Email"
                           required>
                </div>

                <div class="mb-3">
                    <label for="message" class="form-label">Message</label>
                    <textarea class="form-control"
                              id="message"
                              name="message"
                              placeholder="Your Message"
                              rows="4"
                              required></textarea>
                </div>

                <button type="submit" class="btn-blue">
                    Submit
                </button>

                <p id="formMessage"
                   class="mt-3 mb-0"
                   role="status"></p>

            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        &copy; 2026 LMS Platform. All Rights Reserved.
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        document.getElementById("contactForm").addEventListener(
            "submit",
            function(event) {
                event.preventDefault();

                document.getElementById("formMessage").textContent =
                    "Thank you! Your form has been completed.";

                document.getElementById("formMessage").style.color =
                    "#198754";

                this.reset();
            }
        );
    </script>

</body>
</html>
